services:
  drops-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drops-app
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s